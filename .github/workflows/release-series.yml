name: Release scheduled post

# 05:50 UTC = 07:50 Europe/Berlin (CEST), every day. The release calendar in
# .scheduled/releases.json decides whether anything is actually due, so an
# idle run is a green run. Entries that were missed — a failed run, a day
# GitHub skipped the cron — are caught up on the next run.
on:
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Release date to publish (YYYY-MM-DD). Defaults to today, Europe/Berlin."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Release everything that is due
        id: release
        run: python3 .github/scripts/release-scheduled.py ${{ inputs.date }}

      - name: Commit and push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ steps.release.outputs.message || 'release: scheduled post' }}"
          git push origin master
