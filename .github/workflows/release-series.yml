name: Release scheduled post

# GitHub's scheduler runs this job late, consistently: every run between
# 2026-09-09 and 2026-09-18 started 3h46m to 5h09m after its cron time. A
# 05:50 UTC cron therefore landed around 12:20 Europe/Berlin, and the
# announcement post for a release goes out at 08:18 Europe/Berlin — it would
# have linked to a 404 for four hours.
#
# So the cron sits at 00:50 UTC, which leaves 5h28m of headroom before 06:18
# UTC (08:18 CEST) and 6h28m before 07:18 UTC (08:18 CET). 00:50 UTC is the
# same Europe/Berlin calendar day in both CET and CEST, so the "today" the
# script resolves never drifts across a DST boundary. The 03:50 UTC run is a
# catch-up for a cron GitHub skips entirely; the script is idempotent, so it
# is a green no-op whenever the first run did the work.
#
# The release calendar in .scheduled/releases.json decides whether anything is
# actually due, so an idle run is a green run. Entries that were missed are
# caught up on the next run.
on:
  schedule:
    - cron: "50 0 * * *"
    - cron: "50 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Release date to publish (YYYY-MM-DD). Defaults to today, Europe/Berlin."
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Release everything that is due
        id: release
        run: python3 .github/scripts/release-scheduled.py ${{ inputs.date }}

      - name: Commit and push
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "${{ steps.release.outputs.message || 'release: scheduled post' }}"
          git push origin master
