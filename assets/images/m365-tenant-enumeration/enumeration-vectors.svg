<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Six Microsoft 365 enumeration vectors radiating from a central tenant: GetCredentialType, login timing, Autodiscover and OWA, B2B invitations, Teams external access, and OpenID Connect discovery">
  <defs><linearGradient id="ev-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071633"/><stop offset="1" stop-color="#002863"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#ev-bg)"/>
  <g stroke="#3366FF" stroke-opacity="0.08" stroke-width="1"><path d="M0 168H1200M0 336H1200M0 504H1200"/><path d="M300 0V675M600 0V675M900 0V675"/></g>

  <!-- center tenant -->
  <g transform="translate(600 338)" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <circle cx="0" cy="0" r="74" fill="#0e2a5c" stroke="#00D9FF" stroke-width="2.5"/>
    <path d="M0 -34 L30 -20 V6 Q30 34 0 44 Q-30 34 -30 6 V-20 Z" fill="none" stroke="#00D9FF" stroke-width="3"/>
    <text x="0" y="100" fill="#eaf2ff" font-size="17" font-weight="800">M365 tenant</text>
  </g>

  <!-- 6 vectors -->
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="none" stroke="#FF4D6D" stroke-opacity="0.5" stroke-width="2.5">
      <path d="M540 300 L300 150"/><path d="M600 262 L600 120"/><path d="M660 300 L900 150"/>
      <path d="M540 376 L300 526"/><path d="M600 414 L600 556"/><path d="M660 376 L900 526"/>
    </g>
    <g>
      <g transform="translate(300 150)"><rect x="-135" y="-40" width="270" height="80" rx="12" fill="#12213f" stroke="#ECC23B" stroke-width="1.6"/><text x="0" y="-8" fill="#ECC23B" font-size="15" font-weight="700">GetCredentialType</text><text x="0" y="16" fill="#c7d6ff" font-size="12.5">IfExistsResult leaks existence</text></g>
      <g transform="translate(600 100)"><rect x="-135" y="-40" width="270" height="80" rx="12" fill="#12213f" stroke="#ECC23B" stroke-width="1.6"/><text x="0" y="-8" fill="#ECC23B" font-size="15" font-weight="700">Login timing / errors</text><text x="0" y="16" fill="#c7d6ff" font-size="12.5">50126 vs redirect to IdP</text></g>
      <g transform="translate(900 150)"><rect x="-140" y="-40" width="280" height="80" rx="12" fill="#12213f" stroke="#ECC23B" stroke-width="1.6"/><text x="0" y="-8" fill="#ECC23B" font-size="15" font-weight="700">Autodiscover / OWA / EWS</text><text x="0" y="16" fill="#c7d6ff" font-size="12.5">legacy protocols, distinct replies</text></g>
      <g transform="translate(300 526)"><rect x="-135" y="-40" width="270" height="80" rx="12" fill="#12213f" stroke="#ECC23B" stroke-width="1.6"/><text x="0" y="-8" fill="#ECC23B" font-size="15" font-weight="700">B2B invitations</text><text x="0" y="16" fill="#c7d6ff" font-size="12.5">/invitations behaves differently</text></g>
      <g transform="translate(600 576)"><rect x="-135" y="-40" width="270" height="80" rx="12" fill="#12213f" stroke="#ECC23B" stroke-width="1.6"/><text x="0" y="-8" fill="#ECC23B" font-size="15" font-weight="700">Teams external access</text><text x="0" y="16" fill="#c7d6ff" font-size="12.5">starting a chat can reveal a user</text></g>
      <g transform="translate(900 526)"><rect x="-140" y="-40" width="280" height="80" rx="12" fill="#12213f" stroke="#ECC23B" stroke-width="1.6"/><text x="0" y="-8" fill="#ECC23B" font-size="15" font-weight="700">OpenID Connect discovery</text><text x="0" y="16" fill="#c7d6ff" font-size="12.5">managed vs federated domain</text></g>
    </g>
  </g>
</svg>
