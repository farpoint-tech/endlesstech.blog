<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Four concentric defensive layers around a tenant: block legacy authentication, Smart Lockout and password protection, MFA for all users, and monitoring of sign-in logs for enumeration patterns">
  <defs>
    <linearGradient id="dl-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071633"/><stop offset="1" stop-color="#002863"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#dl-bg)"/>
  <g stroke="#3366FF" stroke-opacity="0.08" stroke-width="1"><path d="M0 168H1200M0 336H1200M0 504H1200"/><path d="M300 0V675M600 0V675M900 0V675"/></g>

  <text x="600" y="66" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="1.5" fill="#00D9FF">MAKE THE LEAKED INFORMATION USELESS</text>

  <!-- concentric rings -->
  <g transform="translate(360 380)" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif">
    <circle cx="0" cy="0" r="250" fill="none" stroke="#25406e" stroke-width="26" opacity="0.55"/>
    <circle cx="0" cy="0" r="190" fill="none" stroke="#3366FF" stroke-width="24" opacity="0.6"/>
    <circle cx="0" cy="0" r="132" fill="none" stroke="#00D9FF" stroke-width="22" opacity="0.7"/>
    <circle cx="0" cy="0" r="78" fill="#0e2a5c" stroke="#ECC23B" stroke-width="3"/>
    <text x="0" y="-6" fill="#ECC23B" font-size="16" font-weight="800">Monitoring</text>
    <text x="0" y="16" fill="#ffe6a8" font-size="12.5">50126 / 50053 spikes</text>
  </g>

  <!-- labels on the right -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(720 200)"><circle cx="-14" cy="-6" r="7" fill="#25406e"/><text x="6" y="-10" fill="#eaf2ff" font-size="19" font-weight="700">Block legacy authentication</text><text x="6" y="16" fill="#9db8ff" font-size="14.5">kills Autodiscover / EWS / ActiveSync vectors</text></g>
    <g transform="translate(720 300)"><circle cx="-14" cy="-6" r="7" fill="#3366FF"/><text x="6" y="-10" fill="#eaf2ff" font-size="19" font-weight="700">Smart Lockout + password protection</text><text x="6" y="16" fill="#9db8ff" font-size="14.5">rate-limit spraying, ban common passwords</text></g>
    <g transform="translate(720 400)"><circle cx="-14" cy="-6" r="7" fill="#00D9FF"/><text x="6" y="-10" fill="#eaf2ff" font-size="19" font-weight="700">MFA for all users</text><text x="6" y="16" fill="#9db8ff" font-size="14.5">a valid UPN is worthless without factor two</text></g>
    <g transform="translate(720 500)"><circle cx="-14" cy="-6" r="7" fill="#ECC23B"/><text x="6" y="-10" fill="#eaf2ff" font-size="19" font-weight="700">Monitor the sign-in logs</text><text x="6" y="16" fill="#9db8ff" font-size="14.5">Entra ID Protection: risky sign-ins, impossible travel</text></g>
  </g>
</svg>
