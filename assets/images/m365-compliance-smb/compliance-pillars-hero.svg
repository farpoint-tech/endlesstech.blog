<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Three pillars of Microsoft 365 compliance for small businesses: audit log, retention, and data subject rights, under a GDPR scale"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071633"/><stop offset="1" stop-color="#002863"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><g stroke="#3366FF" stroke-opacity="0.08" stroke-width="1"><path d="M0 168H1200M0 336H1200M0 504H1200"/><path d="M300 0V675M600 0V675M900 0V675"/></g>
<text x="600" y="76" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#00D9FF">MICROSOFT 365 COMPLIANCE FOR SMBs</text>
<text x="600" y="122" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#9db8ff">Microsoft gives you the controls — configuring them is your job</text>
<g transform="translate(250 330)"><rect x="-140" y="-70" width="280" height="200" rx="16" fill="#0d2a5c" stroke="#00D9FF" stroke-width="2.5"/>
    <text x="0" y="-24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#00D9FF">Audit log</text>
    <foreignObject x="-124" y="-4" width="248" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#9db8ff;text-align:center;line-height:1.45">who did what, and for how long you can prove it</div></foreignObject></g><g transform="translate(600 330)"><rect x="-140" y="-70" width="280" height="200" rx="16" fill="#0d2a5c" stroke="#ECC23B" stroke-width="2.5"/>
    <text x="0" y="-24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#ECC23B">Retention</text>
    <foreignObject x="-124" y="-4" width="248" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#9db8ff;text-align:center;line-height:1.45">keep what you must, delete what you may not keep</div></foreignObject></g><g transform="translate(950 330)"><rect x="-140" y="-70" width="280" height="200" rx="16" fill="#0d2a5c" stroke="#FF00FF" stroke-width="2.5"/>
    <text x="0" y="-24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800" fill="#FF00FF">Data subject rights</text>
    <foreignObject x="-124" y="-4" width="248" height="110"><div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Segoe UI,Arial,sans-serif;font-size:14px;color:#9db8ff;text-align:center;line-height:1.45">find it, export it, delete it on request</div></foreignObject></g>
<text x="600" y="620" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#ECC23B">GDPR compliance is a configuration exercise, not a licence you buy</text></svg>