<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Two lists compared side by side: the channel sites SharePoint reports and the private and shared channels Teams still has. Three sites match a live channel and one does not, and the one without a match goes into a review report rather than straight to deletion.">
  <defs>
    <linearGradient id="oc-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071633"/><stop offset="1" stop-color="#002863"/></linearGradient>
    <marker id="oc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b78c4"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#oc-bg)"/>
  <g stroke="#3366FF" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M300 0V675M600 0V675M900 0V675"/>
  </g>

  <text x="600" y="62" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#00D9FF">ORPHANED TEAMS CHANNEL SITES</text>
  <text x="600" y="90" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9db8ff">Two lists, one difference, and a report before any deletion</text>

  <!-- SharePoint side -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="130" width="360" height="360" rx="14" fill="#0b1f47" stroke="#00D9FF" stroke-width="2"/>
    <text x="86" y="164" fill="#eaf2ff" font-size="17" font-weight="700">SharePoint</text>
    <text x="86" y="188" fill="#9db8ff" font-size="13" font-family="Consolas, Menlo, monospace">IsTeamsChannelConnected = true</text>
    <g fill="#cfe0ff" font-size="14" font-family="Consolas, Menlo, monospace">
      <rect x="86" y="208" width="308" height="52" rx="8" fill="#122c5e" stroke="#3366FF" stroke-width="1"/>
      <text x="102" y="230">/sites/Contoso-Budget</text><text x="102" y="250" fill="#8ba4d8">TEAMCHANNEL#1</text>
      <rect x="86" y="272" width="308" height="52" rx="8" fill="#122c5e" stroke="#3366FF" stroke-width="1"/>
      <text x="102" y="294">/sites/Contoso-Legal</text><text x="102" y="314" fill="#8ba4d8">TEAMCHANNEL#0</text>
      <rect x="86" y="336" width="308" height="52" rx="8" fill="#122c5e" stroke="#3366FF" stroke-width="1"/>
      <text x="102" y="358">/sites/Contoso-Vendors</text><text x="102" y="378" fill="#8ba4d8">TEAMCHANNEL#1</text>
      <rect x="86" y="400" width="308" height="52" rx="8" fill="#33131f" stroke="#FF4D6D" stroke-width="2"/>
      <text x="102" y="422" fill="#ffd0da">/sites/Contoso-Rollout</text><text x="102" y="442" fill="#ff9db0">TEAMCHANNEL#1</text>
    </g>
  </g>

  <!-- Teams side -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="470" y="130" width="360" height="360" rx="14" fill="#0b1f47" stroke="#00D9FF" stroke-width="2"/>
    <text x="496" y="164" fill="#eaf2ff" font-size="17" font-weight="700">Teams</text>
    <text x="496" y="188" fill="#9db8ff" font-size="13" font-family="Consolas, Menlo, monospace">private and shared channels</text>
    <g fill="#cfe0ff" font-size="14" font-family="Consolas, Menlo, monospace">
      <rect x="496" y="208" width="308" height="52" rx="8" fill="#122c5e" stroke="#3366FF" stroke-width="1"/>
      <text x="512" y="230">Finance / Budget</text><text x="512" y="250" fill="#8ba4d8">private</text>
      <rect x="496" y="272" width="308" height="52" rx="8" fill="#122c5e" stroke="#3366FF" stroke-width="1"/>
      <text x="512" y="294">Legal / Casework</text><text x="512" y="314" fill="#8ba4d8">private</text>
      <rect x="496" y="336" width="308" height="52" rx="8" fill="#122c5e" stroke="#3366FF" stroke-width="1"/>
      <text x="512" y="358">Supply / Vendors</text><text x="512" y="378" fill="#8ba4d8">shared</text>
      <rect x="496" y="400" width="308" height="52" rx="8" fill="#0b1f47" stroke="#42558c" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="512" y="428" fill="#8ba4d8">no channel points here</text>
    </g>
  </g>

  <!-- match lines -->
  <g fill="none" stroke="#3ddc84" stroke-width="2.5">
    <path d="M400 234 H490"/><path d="M400 298 H490"/><path d="M400 362 H490"/>
  </g>
  <g fill="none" stroke="#FF4D6D" stroke-width="2.5" stroke-dasharray="7 6">
    <path d="M400 426 H490"/>
  </g>

  <!-- outcome -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M838 426 H872" fill="none" stroke="#5b78c4" stroke-width="2.5" marker-end="url(#oc-arrow)"/>
    <rect x="880" y="196" width="260" height="330" rx="14" fill="#0e2436" stroke="#FFB84D" stroke-width="2"/>
    <text x="1010" y="232" text-anchor="middle" fill="#FFB84D" font-size="17" font-weight="700">Review report</text>
    <g fill="#ffe6bd" font-size="14">
      <text x="906" y="268">Parent group only</text><text x="906" y="288">soft deleted?</text>
      <text x="906" y="322">Retention hold</text><text x="906" y="342">on the site?</text>
      <text x="906" y="376">Data still needed</text><text x="906" y="396">by anyone?</text>
      <text x="906" y="430">Channel really</text><text x="906" y="450">gone?</text>
    </g>
    <rect x="906" y="470" width="208" height="38" rx="8" fill="#3a2a10" stroke="#FFB84D" stroke-width="1.5"/>
    <text x="1010" y="495" text-anchor="middle" fill="#FFB84D" font-size="14" font-weight="700" font-family="Consolas, Menlo, monospace">no delete yet</text>
  </g>

  <text x="600" y="560" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#9db8ff">a site with no live channel is a candidate for review, not a confirmed orphan</text>

  <rect x="0" y="600" width="1200" height="75" fill="#04102a"/>
  <rect x="0" y="598" width="1200" height="3" fill="#00D9FF"/>
  <text x="40" y="648" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#eaf2ff">Report before you delete</text>
  <text x="1160" y="648" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#00D9FF">easyM365.de</text>
</svg>
