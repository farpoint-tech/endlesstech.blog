<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Two Apple ADE device states side by side: a device still in the box picks up a new enrollment policy on assignment, while an already enrolled device ignores it until a factory reset">
  <defs><linearGradient id="ade-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071633"/><stop offset="1" stop-color="#002863"/></linearGradient></defs>
  <rect width="1200" height="675" fill="url(#ade-bg)"/>
  <g stroke="#3366FF" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/><path d="M300 0V675M600 0V675M900 0V675"/>
  </g>
  <text x="600" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#00D9FF">APPLE ADE — MIGRATING TO ENROLLMENT POLICIES</text>

  <g transform="translate(60 130)">
    <rect x="0" y="0" width="500" height="440" rx="18" fill="#0d2a5c" stroke="#00D9FF" stroke-width="3"/>
    <text x="250" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#00D9FF">Still in the box</text>
    <text x="250" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#9db8ff">synced from Apple Business, never activated</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c7d6ff">
      <rect x="34" y="100" width="432" height="52" rx="9" fill="#12213f" stroke="#00D9FF" stroke-width="1.5"/><text x="54" y="132">1 · Assign the new Enrollment Policy</text>
      <rect x="34" y="164" width="432" height="52" rx="9" fill="#12213f" stroke="#00D9FF" stroke-width="1.5"/><text x="54" y="196">2 · User powers the device on</text>
      <rect x="34" y="228" width="432" height="52" rx="9" fill="#12213f" stroke="#00D9FF" stroke-width="1.5"/><text x="54" y="260">3 · Setup Assistant applies the policy</text>
      <rect x="34" y="292" width="432" height="52" rx="9" fill="#12213f" stroke="#00D9FF" stroke-width="1.5"/><text x="54" y="324">4 · Done — no further action</text>
    </g>
    <text x="250" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#4ADE80">Migration cost: one assignment</text>
  </g>

  <g transform="translate(640 130)">
    <rect x="0" y="0" width="500" height="440" rx="18" fill="#0b1f47" stroke="#E8804D" stroke-width="2.5"/>
    <text x="250" y="46" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800" fill="#FFB84D">Already enrolled</text>
    <text x="250" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#d6a878">in a user's hands, in service</text>
    <g font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#c7d6ff">
      <rect x="34" y="100" width="432" height="52" rx="9" fill="#12213f" stroke="#E8804D" stroke-width="1.5"/><text x="54" y="132">1 · Assign the new Enrollment Policy</text>
      <rect x="34" y="164" width="432" height="52" rx="9" fill="#12213f" stroke="#E8804D" stroke-width="1.5"/><text x="54" y="196">2 · Nothing changes on the device</text>
      <rect x="34" y="228" width="432" height="52" rx="9" fill="#12213f" stroke="#E8804D" stroke-width="1.5"/><text x="54" y="260">3 · Still nothing — ADE ran at setup</text>
      <rect x="34" y="292" width="432" height="52" rx="9" fill="#12213f" stroke="#E8804D" stroke-width="1.5"/><text x="54" y="324">4 · Needs a factory reset (bar naming)</text>
    </g>
    <text x="250" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ECC23B">Migration cost: a device lifecycle</text>
  </g>
  <text x="600" y="632" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#7f97d6">Microsoft published no retirement date and shipped no migration tool</text>
</svg>
