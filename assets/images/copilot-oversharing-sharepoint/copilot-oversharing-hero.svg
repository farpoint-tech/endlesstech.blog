<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="An AI assistant icon querying a SharePoint site whose sharing permissions are set to everyone, flagged by an oversharing report">
  <defs>
    <linearGradient id="copilot-oversharing-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071633"/><stop offset="1" stop-color="#002863"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#copilot-oversharing-hero-bg)"/>
  <g stroke="#3366FF" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>
  <g transform="translate(330 220)">
