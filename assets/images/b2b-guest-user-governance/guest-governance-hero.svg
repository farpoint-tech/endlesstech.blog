<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="A tenant boundary with three different external access paths feeding in — B2B Collaboration, Direct Connect, and cross-tenant access">
  <defs>
    <linearGradient id="guest-governance-hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071633"/>
      <stop offset="1" stop-color="#002863"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#guest-governance-hero-bg)"/>
  <g stroke="#3366FF" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 135H1200M0 270H1200M0 405H1200M0 540H1200"/>
    <path d="M200 0V675M400 0V675M600 0V675M800 0V675M1000 0V675"/>
  </g>
  <g transform="translate(600 340)">
    <rect x="-220" y="-140" width="440" height="280" rx="24" fill="#0e2a5c" stroke="#00D9FF" stroke-width="3"/>
    <text x="0" y="-100" fill="#9db8ff" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">TENANT BOUNDARY</text>
    <circle cx="-70" cy="-10" r="26" fill="#0e2a5c" stroke="#4ADE80" stroke-width="2.5"/>
    <circle cx="0" cy="10" r="26" fill="#0e2a5c" stroke="#FFB84D" stroke-width="2.5"/>
    <circle cx="70" cy="-10" r="26" fill="#0e2a5c" stroke="#FF6B6B" stroke-width="2.5"/>
  </g>
  <g fill="none" stroke-width="3">
    <path d="M120 180 L 460 250" stroke="#4ADE80"/>
    <path d="M120 340 L 530 340" stroke="#FFB84D"/>
    <path d="M120 500 L 600 420" stroke="#FF6B6B"/>
  </g>
  <text x="230" y="165" fill="#4ADE80" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">B2B Collaboration</text>
  <text x="240" y="325" fill="#FFB84D" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Direct Connect</text>
  <text x="240" y="515" fill="#FF6B6B" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Cross-tenant access</text>
  <text x="600" y="590" fill="#9db8ff" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">Only one of the three shows up in a guest list</text>
</svg>
