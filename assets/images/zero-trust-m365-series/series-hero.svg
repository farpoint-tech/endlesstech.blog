<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="The four Microsoft 365 Zero Trust pillars — Identity, Devices, Apps, and Data — presented as a four-part series aligned to Microsoft Secure Score">
